{% extends "base.html" %}
{% block main %}
<h1>Sign in</h1>
{% if error %}<p class="banner">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  {% csrf_token %}
  <label>Email <input type="email" name="email" value="{{ email|default:'' }}" required autocomplete="username"></label>
  <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
  <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}">
  <button type="submit">Sign in</button>
</form>
<p class="meta">No account? <a href="/signup{% if request.GET.next %}?next={{ request.GET.next|urlencode }}{% endif %}">Create one</a>.</p>
{% if demo_mode %}
<p class="meta">Demo password is <code>samepage-demo</code>. Organizer is organizer@example.org. Or use the demo links above.</p>
{% endif %}
{% endblock %}
