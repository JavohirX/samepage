{% extends "base.html" %}
{% block main %}
<h1>Choose a password</h1>
<p>For <strong>{{ info.email }}</strong>. This link works once and expires {{ info.expires_at|date:"Y-m-d H:i" }} UTC.</p>
<form method="post" action="/password/{{ token }}">
  {% csrf_token %}
  <label>Password (10 characters or more) <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
  <button type="submit">Save and sign in</button>
</form>
{% endblock %}
